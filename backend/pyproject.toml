[project]
name            = "amanuensis-backend"
version         = "0.1.0"
description     = "Amanuensis Backend"
readme          = "README.md"
authors         = [{ name = "fredrir", email = "fhansteen@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling>=2.100,<3",
    "httpx>=0.28,<1",
    "mlx-vlm>=0.3.3,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
amanuensis-backend = "amanuensis_backend.__main__:main"

[build-system]
requires                    = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
